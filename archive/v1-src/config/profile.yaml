# The matching spec. This is the highest-leverage file in the project — tune it by hand.
# Bump profile_version after any change, then run:  python -m jobscraper rescore

profile_version: 1

identity:
  name: Benjamin Fernandez
  graduation: 2026-08
  degree: BEng Computer Engineering, Nanyang Technological University
  summary: >-
    Final-year Computer Engineering student at NTU Singapore, graduating August 2026.
    Backend and infrastructure engineer. Internships at Tencent (cross-border payments
    platform, Java/Spring Boot), Crypto.com (exchange operations platform, FastAPI/React,
    Kubernetes/ArgoCD), and AMD (infrastructure automation, Ansible/Python).
    Strengths: backend services, REST API design, distributed systems, payments and
    exchange infrastructure, Kubernetes and CI/CD, PostgreSQL, Kafka, and LLM/RAG tooling.
    Seeking new-graduate or graduate-programme software engineering roles in Singapore.

locations:
