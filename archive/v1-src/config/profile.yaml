  allow: [singapore, sg]
  # Rejected outright when no Singapore token is present. Matched on whole words
  # only, so short tokens ("us", "ny") cannot fire inside "houston" or "company".
  # A hint here beats "remote" in the same string: "US Remote" is not reachable
  # on a Singapore work visa, so it is elsewhere, not a genuinely remote role.
  deny_hints:
