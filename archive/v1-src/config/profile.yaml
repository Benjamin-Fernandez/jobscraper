titles:
  allow_patterns:
    - '(?i)software\s+(engineer|developer|dev)\b'
    - '(?i)\b(backend|back-end|back end|platform|infrastructure|systems|distributed)\b'
    - '(?i)quant(itative)?\s+(developer|technologist|engineer|researcher)'
    - '(?i)\b(graduate|associate)\s+(programme|program|analyst|engineer|developer)'
    - '(?i)\b(new\s?grad|campus|university|early\s?career|fresh\s?grad)\b'
    - '(?i)(site reliability|reliability|devops|cloud|data|security)\s+engineer'
    - '(?i)\b(full[\s-]?stack|fullstack)\b'
    - '(?i)\b(technology|technical)\s+(analyst|associate|graduate)'
    - '(?i)\bengineer(ing)?\s+(analyst|associate|graduate|rotational)'
    - '(?i)\b(20\s?26|20\s?27)\b'
  deny_patterns:
    - '(?i)\b(senior|sr\.?|staff|principal|lead|director|manager|head of|chief)\b'
    - '(?i)\b(vp|vice president|executive director|managing director)\b'
    - '(?i)\b(intern|internship|working student|apprentice|co-?op)\b'
    - '(?i)\b(sales|marketing|recruit|talent acquisition|human resources)\b'
    - '(?i)\b(legal|counsel|compliance officer|accountant|auditor)\b'
    - '(?i)\b(relationship manager|wealth|private bank|teller|branch)\b'
    - '(?i)\b(mechanical|civil|chemical|process|equipment|facilities)\s+engineer'
    - '(?i)\b(technician|operator|assembler|machinist)\b'

