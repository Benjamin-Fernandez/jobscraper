  # Too vague to judge by rule; routed to the LLM instead of being rejected.
  # Everything not matching `allow` and not listed here is treated as elsewhere,
  # so this list is the ONLY escape hatch from the Singapore-only filter.
  #
  # These only earn a pass when NOTHING concrete is left beside them. "Remote"
  # alone stays ambiguous; "Remote - Munich" does not, because "munich" survives
  # the strip even though it is on no deny list. See matching.location_verdict.
  ambiguous_hints:
