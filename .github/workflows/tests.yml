# The merge gate for every lane PR (PRD section 0.6). Runs the full suite,
# never a -k subset: a lane that breaks another lane's tests must not merge.
name: tests

on:
  pull_request:
    branches: [v2-rebuild]
  push:
    branches: [v2-rebuild]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/run_tests.py
