<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Example Employer Careers</title><style>body{font-family:sans-serif;margin:0}main{padding:16px}
[data-automation-id^="formField-"]{margin:8px 0}.hidden-value,.hidden-file{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[data-automation-id="selectedItemList"]{list-style:none;padding:0;margin:0;display:inline}
[data-automation-id="beecatcher"]{position:absolute;left:-10000px}
input,textarea,button{margin:2px}textarea{width:400px;height:60px}</style></head>
<body>
<div data-automation-id="header"><header><div data-automation-id="headerTitle"><h1>Example Employer</h1></div>
<div data-automation-id="utilityButtonBar"><button aria-haspopup="listbox" aria-expanded="false" data-automation-id="utilityMenuButton" type="button">Settings</button></div>
<nav><button data-automation-id="navigationItem-Candidate Home" type="button">Candidate Home</button></nav></header></div>
<main><div data-automation-id="applyFlowPage">
<h2 data-automation-id="jobTitleHeading">Example Role (REQ-0000)</h2>
<h3>Dropped controls</h3>
<div data-automation-id="beecatcher"><label for="hp-1"><span>Leave this field blank (for robots)</span></label><input type="text" id="hp-1" name="website" value=""></div><div data-automation-id="formField-legalName--firstName"><label for="input-2"><span>Given Name(s)<abbr title="required">*</abbr></span></label><div><div><input type="text" id="input-2" name="legalName--firstName" aria-required="true" value="Alex"></div></div></div>
</div>
<div data-automation-id="pageFooter"><button type="button" data-automation-id="pageFooterBackButton">Back</button>
<button type="button" data-automation-id="pageFooterNextButton">Save and Continue</button></div></main>
<footer data-automation-id="footerContainer"><a data-automation-id="privacyLink" href="#privacy">Privacy</a></footer>
<script type="application/json" id="shim-data">{"options": {}, "search": {}, "drop": {}, "reveal": {}, "next": ""}</script>
<script src="../shim.js"></script>
</body></html>
