<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Example Employer Careers</title><style>body{font-family:sans-serif;margin:0}main{padding:16px}
[data-automation-id^="formField-"]{margin:8px 0}.hidden-value,.hidden-file{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[data-automation-id="selectedItemList"]{list-style:none;padding:0;margin:0;display:inline}
[data-automation-id="beecatcher"]{position:absolute;left:-10000px}
input,textarea,button{margin:2px}textarea{width:400px;height:60px}</style></head>
<body>
<div data-automation-id="header"><header><div data-automation-id="headerTitle"><h1>Example Employer</h1></div>
<div data-automation-id="utilityButtonBar"><button aria-haspopup="listbox" aria-expanded="false" data-automation-id="utilityMenuButton" type="button">Settings</button></div>
<nav><button data-automation-id="navigationItem-Candidate Home" type="button">Candidate Home</button></nav></header></div>
<main><div data-automation-id="applyFlowPage">
<h2 data-automation-id="jobTitleHeading">Example Role (REQ-0000)</h2>
<h3>Enter inside a form (review M8)</h3>
<form action="#" method="post"><div data-automation-id="formField-countryPhoneCode"><label for="enter-prompt"><span>Country Phone Code<abbr title="required">*</abbr></span></label><div><div><div><div tabindex="-1" data-automation-id="multiSelectContainer" id="msc-2" data-uxi-widget-type="multiselect"><div data-automation-id="multiselectInputContainer"><div><input placeholder="Search" aria-invalid="false" aria-describedby="aria-1" aria-required="true" tabindex="0" data-uxi-widget-type="selectinput" id="enter-prompt" value=""><div data-automation-id="promptSelectionLabel"></div><div id="aria-1" data-automation-id="promptAriaInstruction" class="sr-only">options available</div></div><div tabindex="-1"><ul role="listbox" tabindex="0" data-automation-id="selectedItemList" aria-label="items selected" data-uxi-widget-type="selectinputlist"></ul></div><span data-automation-id="promptIcon" data-uxi-widget-type="selectinputicon" aria-invalid="false" tabindex="-2">v</span></div></div></div></div></div></div><div data-automation-id="formField-city"><label for="enter-text"><span>City</span></label><div><div><input type="text" id="enter-text" name="city" value=""></div></div></div><button type="submit">Send</button></form><div data-automation-id="formField-mobileCountryCode"><label for="outside-prompt"><span>Mobile Country Code<abbr title="required">*</abbr></span></label><div><div><div><div tabindex="-1" data-automation-id="multiSelectContainer" id="msc-4" data-uxi-widget-type="multiselect"><div data-automation-id="multiselectInputContainer"><div><input placeholder="Search" aria-invalid="false" aria-describedby="aria-3" aria-required="true" tabindex="0" data-uxi-widget-type="selectinput" id="outside-prompt" value=""><div data-automation-id="promptSelectionLabel"></div><div id="aria-3" data-automation-id="promptAriaInstruction" class="sr-only">options available</div></div><div tabindex="-1"><ul role="listbox" tabindex="0" data-automation-id="selectedItemList" aria-label="items selected" data-uxi-widget-type="selectinputlist"></ul></div><span data-automation-id="promptIcon" data-uxi-widget-type="selectinputicon" aria-invalid="false" tabindex="-2">v</span></div></div></div></div></div></div>
</div>
<div data-automation-id="pageFooter"><button type="button" data-automation-id="pageFooterBackButton">Back</button>
<button type="button" data-automation-id="pageFooterNextButton">Save and Continue</button></div></main>
<footer data-automation-id="footerContainer"><a data-automation-id="privacyLink" href="#privacy">Privacy</a></footer>
<script type="application/json" id="shim-data">{"options": {"enter-prompt": ["Singapore (+65)", "Malaysia (+60)"], "outside-prompt": ["Singapore (+65)", "Malaysia (+60)", "United States of America (+1)"]}, "search": {"enter-prompt": true, "outside-prompt": true}, "drop": {}, "reveal": {}, "next": ""}</script>
<script src="../shim.js"></script>
</body></html>
