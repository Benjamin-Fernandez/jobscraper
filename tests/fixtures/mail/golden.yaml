# Golden cases for F-50 (mail_status_design.md 6-8 and 14; build plan WP-T1). Synthetic only:
# Example Corp (example.com), Northwind Traders (northwind.example) and Contoso Bank
# (contoso.example) on reserved domains, real platform domains (public), no copied mail.
#
# A case: the .eml in golden/, how it arrives (folder = the MailboxRole being scanned,
# X-GM-LABELS, X-GM-MSGID, X-GM-THRID), the AuthResult its Authentication-Results header gives
# (auth), and what the stage decides against `apps` under `context`:
#   skip:        {gate: header|content, reason: <Reason>}, or null
#   category:    the rule classifier's Category; status_words: the Verdict flag
#   conflict:    the categories behind a "conflict:a+b" rule verdict
#   rule_category: the category of the deciding phrase when it differs from `category`
#                (D-92: an `interview` hit from a `kind: assessment` sender is `assessment`)
#   match:       {kind, job_id} or {kind: ambiguous, candidates: [...]} (MS 7)
#   change:      {kind, reason, to} from transition.decide (MS 8); to: null = check the portal/email.
#                A reason list means any of them: an ambiguous match that settles as NONE takes
#                the first candidate's reason, and MS 7 doesn't fix the candidate order
#   needs_model: the flow would ask the model first (MS 6.5); `change` is for the rule verdict
#   tags:        the tricky cases it covers (test_mail_fixtures checks the build plan's list)
# To add a case (MS 14): write the .eml by hand, add its row here, run
# `python tests/run_tests.py -k mail_fixtures` and `-k mail_rules`.
# Northwind and Contoso use the reserved .example TLD so that the "first label of each employer
# domain" variant (MS 7) names the employer instead of giving every employer "example".
version: 1
context:
  now: "2026-11-02T12:00:00"
  window_start: "2026-08-01T00:00:00"     # the account's first_sync_from (MS 5.3)
  own: [alex.applicant@inbox.example]
  statuses: [to_apply, applied, assessment, interviewing, offer, rejected, withdrawn]
  mail_status:                            # the MS 10.4 defaults that build_policy reads
    require_auth: true
    ranks: {to_apply: 0, applied: 1, assessment: 2, interviewing: 3, offer: 4}
    terminal: [rejected, withdrawn]
    category_status: {acknowledged: applied, assessment: assessment, interview: interviewing,
                      offer: offer, rejected: rejected, withdrawn: withdrawn,
                      posting_closed: rejected, kept_on_file: rejected}
    suggest_only: [posting_closed, kept_on_file]
    junk_auto: [acknowledged]
apps:                                     # AppCandidate fields; tenant_hosts as mail_match_context gives them (E1)
  - job_id: ex-swe
    status: applied
    company_names: [Example Corp, Example Corporation Pte Ltd]
