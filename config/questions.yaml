  - key: singapore_status.ns_status
    kind: enum
    sensitive: true
    synonyms:
      - national service status          # [brief] banks on Workday / SuccessFactors still ask (TAFEP says they should not)
      - national service
      - ns status
      - ns liability
      - ns obligation
      - ns completion
      - completed national service
      - operationally ready
      - military service
      - nsman
      - nsf
      - ns
    exclude: []
    value_map:
      completed: [completed, completed ns, completed national service, completed full time national service, nsman, ns man, ord, fulfilled, operationally ready, served, yes completed]
      serving: [serving, currently serving, still serving, in service, nsf, ongoing, yet to complete, not yet completed, pending]
      exempted: [exempted, exempt, exempted from ns, disqualified, deferred, medically exempted]
      not_applicable: [not applicable, na, n a, not liable, female, foreigner, non singaporean, no obligation, not required, nil, none]
    # yes_if (apply_design 7.3.3): Yes/No labels answered from ns_status (TAFEP says employers should not ask, but
    # banks and some Workday / SuccessFactors forms still do). Wording [common]; not individually web-verified
    # (2026-11-02). Each list is literally true for every enum value: "Have you completed NS?" is No for serving,
    # exempted and not_applicable. "Are you liable for NS?" is not mapped on purpose (NSmen stay liable for
    # reservist duty after ORD, so no single set of enum values answers it).
    yes_if:
      - id: ns_completed
        values: [completed]
        synonyms:
          - have you completed your full time national service
          - have you completed full time national service
          - have you completed your national service
          - have you completed national service
          - have you completed your full time ns
          - have you completed your ns
          - have you completed ns
          - have you served your national service
          - have you served national service
          - completed full time national service
          - completed national service
          - completed full time ns
          - completed ns
        exclude:
          - not completed
          - not yet completed
          - yet to complete
          - completed or
          - or exempted
          - or been exempted
          - or serving

      - id: ns_completed_or_exempt
        values: [completed, exempted]
        synonyms:
          - have you completed or been exempted from national service
          - have you completed or been exempted from ns
          - have you completed or are you exempted from national service
          - completed or been exempted from national service
          - completed or exempted from national service
          - completed or been exempted from ns
          - completed or exempted from ns
          - exempted or completed national service
          - exempted or completed ns
        exclude: []

      # "Fulfilled" reads Yes for someone with nothing left to do, so not_applicable (no NS liability) is Yes too.
      - id: ns_obligations_fulfilled
        values: [completed, exempted, not_applicable]
        synonyms:
          - have you fulfilled your national service obligations
          - have you fulfilled your ns obligations
          - have you fulfilled national service obligations
          - have you fulfilled ns obligations
          - fulfilled your national service obligations
          - fulfilled your ns obligations
        exclude:
          - not fulfilled
          - yet to fulfil
          - yet to fulfill

      - id: ns_serving
        values: [serving]
        synonyms:
          - are you currently serving your national service
          - are you currently serving full time national service
          - are you currently serving national service
          - are you currently serving your ns
          - are you currently serving ns
          - are you still serving national service
          - are you still serving ns
          - are you currently an nsf
          - have you yet to complete national service
          - have you yet to complete your national service
          - yet to complete national service
          - yet to complete ns
        exclude: []

      - id: ns_exempted
        values: [exempted]
        synonyms:
          - have you been exempted from national service
          - have you been exempted from ns
          - are you exempted from national service
          - are you exempted from ns
          - are you exempt from national service
          - are you exempt from ns
          - exempted from national service
          - exempted from ns
          - exempt from national service
          - disqualified from national service
        exclude:
          - completed or
          - or completed
