    value_map:
      citizen: [singapore citizen, singaporean, sg citizen, citizen, singapore citizen or permanent resident, singapore citizen or pr, singapore citizen pr, citizen or pr, citizen or permanent resident]
      pr: [singapore permanent resident, permanent resident, singapore pr, sg pr, spr, pr, singapore citizen or permanent resident, singapore citizen or pr, singapore citizen pr, citizen or pr, citizen or permanent resident]
      foreigner: [foreigner, foreign national, non singaporean, non resident, international, expatriate, work pass holder, others, other, neither]
    # Caveat: a profile value of citizen also "contains"-matches the option "Non-Singapore Citizen"; the 7.3.2
