          - non pr
          - not a singapore
          - not singapore
          - non singapore
          - not a permanent
          - not permanent

      # Yes for anyone who is NOT a citizen ("non-Singapore citizen"): PR or foreigner.
      - id: non_citizen
        values: [pr, foreigner]
        synonyms:
          - are you a non singapore citizen
          - are you not a singapore citizen
          - non singapore citizen
          - not a singapore citizen
          - non singaporean
          - not a singaporean
          - non citizen of singapore
