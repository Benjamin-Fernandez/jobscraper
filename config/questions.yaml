      - legally authorized to work
      - legally entitled to work
      - legally allowed to work
      - eligible to work in singapore
      - right to work in singapore
      - right to work
      - work authorisation
      - work authorization
      - authorization to work          # [gh] "Your authorization to work in the country where you live" (no country named: treated as SG, the profile's home country)
      - authorisation to work
      - permitted to work
      - eligible to work
    exclude: [united states, u s, usa, united kingdom, uk, canada, australia, europe, european union, india, germany, hong kong, malaysia, china, japan, argentina]

