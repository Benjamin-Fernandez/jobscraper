# JobScraper question-synonym table (M20 resolver, tier 2). Public, generic data: no personal values.
# Format and matching: docs/architecture/apply_design.md sections 7.1 (phrase match), 7.3.1, 7.3.2.
# Phrases are plain lowercase, no apostrophes or punctuation (the label normaliser strips both).
# A one-token phrase matches only labels of 4 tokens or fewer. Score = tokens of the longest
# matching phrase; a tie between different keys answers nothing, so near-collisions are avoided
# deliberately (e.g. the 3-token "expected graduation year" beats the 2-token "expected graduation").
# Provenance tags:  [gh]  wording seen in the recorded Greenhouse schemas gh_vercel.json / gh_dataiku.json
#   (public, 2026-11-01);  [brief]  auto_apply_brief section 6;  [design]  apply_design 7.3;
#   [common]  wording common on Greenhouse / Lever / Ashby / Workday and Singapore forms, from general
#   knowledge of those forms and NOT individually web-verified (2026-11-02). Unusual variants carry a note.
#
# NOT in this file on purpose: declarations (PEP, audit-client independence, shareholdings, relatives,
# criminal, bankruptcy, regulatory, non-compete, health, prior employment, previously applied). They are
# resolved by tier 4 (declarations.py) because they need company matching over lists; a tier-2 entry
# would pre-empt that, since tier 2 runs first. Label-variant phrases found while researching, offered
# for the tier-4 classifier table (apply_design 7.5) in addition to its listed phrases:
#   pep: "politically exposed person", "pep", "prominent public function", "close associate of a",
#        "holds or has held a public office", "immediate family member of a senior"
#   prior_employment_at_company: "are you currently an employee at" [gh], "have you ever worked for",
#        "ever been employed by", "previously worked for", "former employee", "worked at"
#   relatives_at_company: "related to anyone", "family member currently working", "friends or relatives"
#   criminal_record: "ever been convicted", "pending criminal", "criminal proceedings", "criminal offence"
#   conflict_audit_independence: "audit client", "independence requirements", "conflict of interest"
#   non_compete: "non compete", "restrictive covenant", "bound by any agreement", "notice or garden leave"
# US EEO/self-ID labels ("veteran", "disability", "racial/ethnic background", "gender identity",
# "sexual orientation", "transgender" [gh]) are tier 1 (EEO_* canonical), so they are not repeated here.
# Yes/No labels for an enum key ("Are you a Singapore Citizen?") are answered by the `yes_if` rules on the enum
# entry (residency_status, work_pass, ns_status below): apply_design 7.3.3. Known design limit:
# "years of experience with <skill>" is excluded on purpose.
version: 1
questions:
  # ---------------- Singapore status ----------------
  # D-75 work rights (questions_design 8.2-8.3, WP-A04, 2026-11-10): two `kind: country_bool` rows replace the
  # four per-country bool rows (authorised_to_work.SG/.US, requires_sponsorship.SG/.US). The resolver detects
  # the country (or countries) from the label and answers from applicant.work_right(profile, country), so these
  # rows carry NO country excludes. A label naming no country uses the job's / residence country (8.2).
  # Synonyms: the QD 8.3 minimum set plus every phrase of the four old rows (country-suffixed phrases are kept:
  # the country words are harmless now and the longer phrase helps this row win a score tie).
  # Rule (8.3): `without ...` phrases belong ONLY to the authorised row; the sponsorship row has exclude [without],
  # so "Can you work in the US without sponsorship?" answers authorised-and-needs-none, never the sponsorship row.
  - key: singapore_status.authorised_to_work
    kind: country_bool
    sensitive: false
    synonyms:
      - authorised to work
      - authorized to work
      - legally authorised to work
      - legally authorized to work
      - legally entitled to work
      - legally allowed to work
      - legally eligible to work
      - legally able to work
      - eligible to work
      - eligible for employment
      - right to work
      - work authorisation
      - work authorization
      - authorisation to work
      - authorization to work          # [gh] "Your authorization to work in the country where you live" (no country named: job/residence country, 8.2)
      - permitted to work
      - allowed to work
      - entitled to work
      - work rights
      - working rights
      - without sponsorship
      - without visa sponsorship
      - without requiring sponsorship
      # kept from the old .SG / .US rows
      - authorised to work in singapore
      - authorized to work in singapore
      - eligible to work in singapore
      - right to work in singapore
      - authorized to work in the united states
      - authorised to work in the united states
      - authorized to work in the u s
      - legally authorized to work in the united states
      - eligible to work in the united states
      - right to work in the united states
      - work authorization in the united states
    exclude: []

  - key: singapore_status.requires_sponsorship
    kind: country_bool
    sensitive: false
    synonyms:
      - require sponsorship               # [gh] "Will you require Visa Sponsorship now, or in the future?"
      - require visa sponsorship
      - need sponsorship
      - need visa sponsorship
      - visa sponsorship                  # [gh] "Would you require a visa sponsorship or visa transfer"
      - work visa sponsorship
      - immigration sponsorship
      - sponsorship to work
      - sponsorship for employment
      - sponsorship now or in the future
      - now or in the future require
      - require a work permit
      - need a work permit
      - work permit required
      - require a work visa
      - need a work visa
      - work visa required
      - visa required
      - require a visa
      - need a visa
      - require visa support
      - visa transfer
      - require an employment pass        # the work_pass yes_if rows never list a bare "employment pass" (see there)
      - need an employment pass
      - require a work pass
      - need a work pass
      - work pass sponsorship
      # kept from the old .US row
      - require sponsorship to work in the united states
      - visa sponsorship in the united states
      - sponsorship to work in the u s
      - require visa sponsorship in the u s
      - require sponsorship for employment in the united states
    exclude: [without]

  - key: singapore_status.residency_status
    kind: enum
    sensitive: true
    synonyms:
      - singapore citizen or permanent resident   # [brief] the common combined question on Singapore forms
      - singapore citizen or pr
      - singapore citizen pr
      - citizen or permanent resident
      - citizen or pr
      - citizen pr
      - residency status
      - residential status
      - citizenship status
      - citizen status
      - immigration status
      - pr status
      - singapore pr
      - singapore citizen
      - permanent resident
      - are you a citizen
    exclude: []
    value_map:
      citizen: [singapore citizen, singaporean, sg citizen, citizen, singapore citizen or permanent resident, singapore citizen or pr, singapore citizen pr, citizen or pr, citizen or permanent resident]
      pr: [singapore permanent resident, permanent resident, singapore pr, sg pr, spr, pr, singapore citizen or permanent resident, singapore citizen or pr, singapore citizen pr, citizen or pr, citizen or permanent resident]
      foreigner: [foreigner, foreign national, non singaporean, non resident, international, expatriate, work pass holder, others, other, neither]
    # yes_if (apply_design 7.3.3): Yes/No labels answered from residency_status. Wording [common] on Singapore
    # forms; "Are you a Singapore Citizen?" is also a Lever field under "Singapore Work Eligibility" (web-search
    # result 2026-11-02; the page 404'd on fetch, so not re-verified). Every `exclude` below is 2+ tokens on
    # purpose: a one-token phrase matches only labels of 4 tokens or fewer (7.1). "/" becomes a space
    # ("Citizen/PR" -> "citizen pr"). Compound labels go to the combined rule; negations to non_citizen / foreigner.
    yes_if:
      - id: sg_citizen
        values: [citizen]
        synonyms:
          - are you a singapore citizen
          - are you singapore citizen
          - are you a citizen of singapore
          - are you a singaporean
          - are you singaporean
          - hold singapore citizenship
          - singapore citizen
          - citizen of singapore
          - singapore citizenship
          - sg citizen
          - singaporean
        exclude:
          - or pr
          - or spr
          - or permanent
          - and pr
          - and permanent
          - citizen pr
          - citizen spr
          - citizen permanent
          - singaporean pr
          - singaporean permanent
          - or singapore citizen
          - or singaporean
          - and singapore citizen
          - and singaporean
          - or citizen
          - and citizen
          - or employment pass
          - or work pass
          - or s pass
          - or foreigner
          - non singapore
          - not singapore
          - not a singapore
          - not a citizen
          - not citizen
          - non citizen

      - id: sg_citizen_or_pr
        values: [citizen, pr]
        synonyms:
          - singapore citizen or permanent resident
          - singapore citizen or singapore permanent resident
          - singapore citizen and permanent resident
          - singapore citizen or singapore pr
          - singapore citizen or spr
          - singapore citizen or pr
          - singapore citizen and pr
          - singapore citizen permanent resident
          - singapore citizen spr
          - singapore citizen pr
          - singaporean or permanent resident
          - singaporean permanent resident
          - singaporean or pr
          - singaporean pr
          - singapore permanent resident or singapore citizen
          - singapore permanent resident or citizen
          - singapore pr or singapore citizen
          - singapore pr or singaporean
          - singapore pr or citizen
          - singapore pr citizen
          - citizen or permanent resident
          - citizen permanent resident
          - citizen or pr
          - citizen spr
          - citizen pr
          - permanent resident or citizen
          - pr or singapore citizen
          - pr or citizen
          - pr citizen
        exclude:
          - non singapore
          - not singapore
          - not a singapore
          - not a citizen
          - not citizen
          - non citizen
          - not a pr
          - not pr
          - non pr
          - not a permanent
          - not permanent

      - id: sg_pr
        values: [pr]
        synonyms:
          - are you a singapore permanent resident
          - are you a singapore pr
          - are you a permanent resident of singapore
          - are you an spr
          - hold singapore pr
          - singapore permanent resident
          - singapore permanent residency
          - permanent resident of singapore
          - singapore pr holder
          - singapore pr
          - spr holder
        exclude:
          - citizen or
          - or citizen
