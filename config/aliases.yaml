# JobScraper term-variant dictionary (M20 tailor). Public, generic data: no personal content.
# Format: docs/architecture/tailor_design.md section 6.1.
# Rules (loader-enforced): a string appears in at most one entry; canonicals unique by token key;
# kind in tool | language | framework | platform | practice | domain | soft.
# Every `variants` item is a STRICT synonym: swapping it for the canonical (or back) never changes
# the claim. Deliberately NOT variants (different claims): JavaScript vs TypeScript, Angular vs
# AngularJS, "continuous integration" vs CI/CD (CI alone is only half), "data analysis" vs "data
# science", "SQL" vs "MySQL", "Java" vs "JavaScript", "AWS" vs any single AWS service.
# `instances` stay empty: no "instance-of" claim is made here (those are the owner's to curate).
# Provenance: spelling, acronym and vendor-name facts are common knowledge of public product names
# (not individually web-verified, 2026-11-02); the golden terms are copied from TD section 15.
version: 1
ambiguous: [go, c, r]
