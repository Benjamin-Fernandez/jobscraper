# JobScraper v2 runtime configuration. See .claude/prds/jobscraper-v2.prd.md.
#
# Paths are relative to the project root unless absolute.
#
# Every deployment-shaped value can be overridden by an environment variable,
# which is what lets the same code run from a checkout and, one day, from a
# container without editing this file (PRD section 8.6):
#
#   JOBSCRAPER_CONFIG   path to this file
#   JOBSCRAPER_DB       path to the database
#   JOBSCRAPER_HOST     web bind address
#   JOBSCRAPER_PORT     web port

paths:
  watchlist: config/watchlist.yaml            # companies to watch - hand-edited
  rules: config/rules.yaml                    # the prefilter - hand-edited
  profile: data/profile.derived.yaml          # generated from your resume
  profile_overrides: config/profile.overrides.yaml   # your corrections; never regenerated
  resume_dir: data                            # where resume.pdf / resume.docx lives
  db: data/jobscraper.db
  shortlist: data/shortlist.json              # the accepted queue the web app reads
  output_dir: output                          # legacy, for review.py; retired in M9-T1

run:
  # Companies per run. PRD R-7: at 229 companies this needs ~1.6 runs/day to
  # finish a 14-day sweep. Raise it if you run less often than that.
  batch_size: 10
  # A company becomes due again this many days after it was last scraped.
  # This is the whole two-week cycle: there is no separate cursor (D-9).
  cycle_days: 14
  max_workers: 6
  per_company_timeout: 90
  # A run still marked `running` this many seconds after it started is taken to
  # have crashed, and the next run marks it failed (PRD 8.3[0], R-12).
  per_run_timeout: 3600
  request_timeout: 25
  # Seconds between requests to the same host.
  rate_limit_delay: 0.7
  max_retries: 3
  # Consecutive failures before a company is quarantined.
  quarantine_threshold: 3
  # Quarantined companies get one retry every Nth run.
  probation_every_n_runs: 4
  # If more than this fraction of a batch fails, treat it as a local fault:
  # quarantine nobody and roll back failure counters.
  global_failure_abort_pct: 0.5
  respect_robots: true
  user_agent: "JobScraper/2.0 (personal job-search tool)"

budget:
  enable_llm: true
  # How the judge reaches a model. See src/jobscraper/backends.py.
  #   cli  - runs `claude -p`, the Claude Code CLI. Uses the subscription you
  #          are already signed into; no API key, no per-token bill.
  #   api  - the anthropic SDK. Needs ANTHROPIC_API_KEY.
  #   ollama - a local open model (Qwen3) served by Ollama on this machine's
  #          GPU. No key, no login. `ollama pull qwen3:14b` first. The Docker
  #          setup uses this (env JOBSCRAPER_BACKEND / JOBSCRAPER_OLLAMA_URL).
  #   off  - no model; the prefilter alone decides.
  # 2026-09-24: the local Qwen model replaces Haiku as the judge.
  backend: ollama
  ollama_url: http://127.0.0.1:11434
  # 9.3 GB; fits a 16 GB GPU with room for the context below. qwen3:8b (5.2 GB)
  # is the step down if memory is tight.
  ollama_model: qwen3:14b
  # Tokens of context per call. A 20-posting decide batch is ~6-7k tokens;
  # Ollama's own default is far smaller and would silently truncate the prompt.
  ollama_num_ctx: 16384
  ollama_timeout: 600
  cli_bin: ""                                 # empty = find `claude` on PATH
  cli_timeout: 300
  # Measured 2026-09-24: with only --restricted, every call carried ~21,000
  # tokens of Claude Code's own tool definitions; with no tools, 536. The
  # judge only reads text and answers JSON, so it gets no tools, no MCP
  # servers and no skills.
  cli_extra_args: ["--restricted", "--strict-mcp-config", "--disable-slash-commands",
                   "--tools", ""]
  # Consecutive transport failures before the judge stands down for this run.
  max_consecutive_failures: 3
  # One model, the cheapest (D-6). Tier routing went with the tiering.
  model: claude-haiku-4-5-20251001
  max_tokens_per_run: 2000000
  # Postings per decide call. Per-call overhead dominates the cost, so larger is
  # cheaper - until a call starts hitting cli_timeout.
  decide_batch: 20
  # Hard ceiling on the vital extract sent per posting (PRD section 8.3[4]).
  # This is the single number that decides what a run costs.
  vital_chars: 800

web:
  # 127.0.0.1, never 0.0.0.0. There is no authentication (PRD R-9), so binding
  # wide on a personal machine would be a security regression.
  host: 127.0.0.1
  port: 8765

applications:
  # Ordered. Adding a status is a config change, not a migration (M8-T2):
  # restart `web` and it is in the Applications dropdown (served by /api/stats).
  # Keep `to_apply` and `applied` - the Inbox's "Mark applied" button writes
  # `applied`. This list is not in rules.yaml, so editing it never
  # invalidates stored prefilter verdicts.
  statuses: [to_apply, applied, interviewing, offer, rejected, withdrawn]

judge:
  # The kinds of role you are open to. The model marks a posting as a fit when
  # it is in or near ANY of these, and leans towards yes when unsure: a wasted
  # opportunity costs more than one extra card in the Inbox (user, 2026-09-24).
  # Edit freely; it takes effect on the next run.
  interests:
    - software engineering (backend, full stack, mobile, data, AI/ML)
    - infrastructure, platform, cloud, DevOps and site reliability
    - technical support and support engineering
    - operations (technology, business and finance operations)
    - finance and fintech roles
    - product management and product owner
    - project management
    - trade desk engineer, trade associate, trade operations analyst
    - analyst, associate in financial firms
