# JobScraper v2 runtime configuration. See .claude/prds/jobscraper-v2.prd.md.
#
# Paths are relative to the project root unless absolute.
#
# Every deployment-shaped value can be overridden by an environment variable,
# which is what lets the same code run from a checkout and, one day, from a
# container without editing this file (PRD section 8.6):
#
#   JOBSCRAPER_CONFIG   path to this file
#   JOBSCRAPER_DB       path to the database
#   JOBSCRAPER_HOST     web bind address
#   JOBSCRAPER_PORT     web port

# The limits in force (M15, src/jobscraper/config.py PLANS). A plan decides which
# cycle lengths the web app offers and how many job titles and title
# recommendations you get. `local` (this install) has the most generous limits;
# free / plus / pro are the future tiers of the multi-user service:
#   free  - cycle 7/14/30 days, 5 titles, 5 recommendations
#   plus  - cycle 3/7/14/30 days, 10 titles, 10 recommendations
#   pro   - cycle 1/3/7/14/30 days, 20 titles, 20 recommendations
plan: local

paths:
  watchlist: config/watchlist.yaml            # companies to watch - hand-edited
  rules: config/rules.yaml                    # the prefilter - hand-edited
  profile: data/profile.derived.yaml          # generated from your resume
  profile_overrides: config/profile.overrides.yaml   # your corrections; never regenerated
  resume_dir: data                            # where resume.pdf / resume.docx lives
  db: data/jobscraper.db
  shortlist: data/shortlist.json              # the accepted queue the web app reads
  applicant: data/applicant.yaml              # your application details (M20) - gitignored
  questions: config/questions.yaml            # how form questions map onto them (M20)
  aliases: config/aliases.yaml                # tailor: term variants (true synonyms only)
  master_resume: data/master_resume.json      # tailor: your resume, parsed once (gitignored)
  tailored_dir: data/tailored                 # tailor: per-job resumes, deleted after a while (gitignored)
  mail_rules: config/mail_rules.yaml          # email updates: sender platforms, gates, phrases (F-50)

run:
  # Companies per run. PRD R-7: at 295 companies this needs ~4.2 runs/day to
  # finish a 7-day sweep (~1/day at 45). Raise it if you run less often than that.
  batch_size: 10
  # A company becomes due again this many days after it was last scraped.
  # This is the whole cycle: there is no separate cursor (D-9). 14 until
  # 2026-09-27, when the user moved to a weekly sweep. Since M15 this is only
  # the default: the cycle chosen in the web app's Settings tab wins.
  cycle_days: 7
  max_workers: 6
  per_company_timeout: 90
  # A run still marked `running` this many seconds after it started is taken to
  # have crashed, and the next run marks it failed (PRD 8.3[0], R-12).
  per_run_timeout: 3600
  request_timeout: 25
  # Seconds between requests to the same host.
  rate_limit_delay: 0.7
  max_retries: 3
  # Consecutive failures before a company is quarantined.
  quarantine_threshold: 3
  # Quarantined companies get one retry every Nth run.
  probation_every_n_runs: 4
  # If more than this fraction of a batch fails, treat it as a local fault:
  # quarantine nobody and roll back failure counters.
  global_failure_abort_pct: 0.5
  respect_robots: true
  user_agent: "JobScraper/2.0 (personal job-search tool)"

scrape:
  # Places large boards are narrowed to (D-33). A Workday board with more than
  # the 600-posting cap is re-queried with its own location facet for these;
  # SmartRecruiters gets `&country=sg`. Small boards cost no extra request.
  locations: [Singapore]

budget:
  enable_llm: true
  # How JobScraper reaches a model - for judging postings AND for parsing the
  # resume. See src/jobscraper/backends.py.
  #   ollama - Qwen3, an open model served by Ollama on this machine's GPU.
  #            No key, no login. `ollama pull qwen3:14b` first. Docker points
  #            at its Ollama service (env JOBSCRAPER_BACKEND / JOBSCRAPER_OLLAMA_URL).
  #   off    - no model; the prefilter alone decides, survivors wait.
  # Qwen replaced Claude Haiku as the judge on 2026-09-24 and as the resume
  # parser on 2026-09-28; the Claude transports are gone (PRD M14).
  backend: ollama
  ollama_url: http://127.0.0.1:11434
  # 9.3 GB; fits a 16 GB GPU with room for the context below. qwen3:8b (5.2 GB)
  # is the step down if memory is tight. Changing it re-judges every posting.
  ollama_model: qwen3:14b
  # Tokens of context per call. A 20-posting decide batch is ~6-7k tokens;
  # Ollama's own default is far smaller and would silently truncate the prompt.
  ollama_num_ctx: 16384
  ollama_timeout: 600
  # Consecutive transport failures before the judge stands down for this run.
  max_consecutive_failures: 3
  # Postings per decide call. Per-call overhead dominates, so larger is faster -
  # until a call starts hitting ollama_timeout or overflows ollama_num_ctx.
  decide_batch: 20
  # Hard ceiling on the vital extract sent per posting (PRD section 8.3[4]).
  # This is the single number that decides what a run costs.
  vital_chars: 800

web:
  # 127.0.0.1, never 0.0.0.0. There is no authentication (PRD R-9), so binding
  # wide on a personal machine would be a security regression.
  host: 127.0.0.1
  port: 8765

applications:
  # Ordered. Adding a status is a config change, not a migration (M8-T2):
  # restart `web` and it is in the Applications dropdown (served by /api/stats).
  # Keep `to_apply` and `applied` - the Inbox's "Mark applied" button writes
  # `applied`. This list is not in rules.yaml, so editing it never
  # invalidates stored prefilter verdicts. `assessment` (tests, coding
  # challenges, one-way video) is what email updates set between applied and
  # interviewing (F-50); remove it and such emails become suggestions instead.
  statuses: [to_apply, applied, assessment, interviewing, offer, rejected, withdrawn]

judge:
  # The kinds of role you are open to. The model marks a posting as a fit when
  # it is in or near ANY of these, and leans towards yes when unsure: a wasted
  # opportunity costs more than one extra card in the Inbox (user, 2026-09-24).
  # Edit freely; it takes effect on the next run.
  interests:
    - software engineering (backend, full stack, mobile, data, AI/ML)
    - infrastructure, platform, cloud, DevOps and site reliability
    - technical support and support engineering
    - operations (technology, business and finance operations)
    - finance and fintech roles
    - product management and product owner
    - project management
    - trade desk engineer, trade associate, trade operations analyst
    - analyst, associate in financial firms

retention:
  # Stored job descriptions are deleted this many days after they were fetched,
  # to keep the database small (M17). Roles the judge accepted and roles you
  # track in Applications keep theirs - the Inbox shows it. 0 keeps everything.
  description_days: 7

apply:
  # Auto-apply (M20, docs/architecture/apply_design.md §16). Settings → Apply
  # in the web app overrides mode, the caps, headed and captcha_wait_s.
  mode: auto                 # auto | dry_run. auto = Auto-apply fills the form and clicks Submit (owner, D-203); dry_run = fill only, never Submit
  daily_cap: 0               # D-204: Submit clicks per day (Asia/Singapore); 0 = no limit
  per_employer_daily_cap: 10  # D-204: per employer per day; 0 = no limit
  headed: true               # D-53: show the Edge window
  captcha_wait_s: 0          # F-38: seconds to leave a CAPTCHA'd tab open for you
  profile_dir: "%LOCALAPPDATA%\\JobScraper\\apply-profile"
  edge_sync: false           # S-1: true drops --disable-sync (only after the owner's sync test)
  edge_save_bubble: false    # best-effort UIA click on Edge's Save prompt; needs edge_sync
  type_delay_ms: 60          # press_sequentially delay (react-select search, retries)
  action_pause_ms: 250       # fixed pause after each field (NF-05)
  step_timeout_s: 45         # waiting for a page or step to appear
  confirm_timeout_s: 60      # F-37
  attempt_timeout_s: 420     # whole attempt, Greenhouse and others, excluding the mail wait (NF-07, D-81)
  attempt_timeout_workday_s: 900   # Workday attempt, excluding the mail wait (D-81)
  dry_run_hold_s: 600        # F-37 dry run: keep the filled form open
  resume_format: pdf         # pdf | docx: which tailored file to upload when both exist
  mygreenhouse: true         # D-70: click "Autofill with (My)Greenhouse" when present, then fill only the gaps
  mygreenhouse_wait_s: 20
  workday_entry: auto        # D-78: auto = Autofill with Resume when offered, else Apply Manually | manual
  max_wizard_steps: 15
  llm_text_temperature: 0.3
  fill: llm                  # D-78: the local model fills every page | rules (the pre-D-78 path)
  model_sees_sensitive: true # D-105: the AI may read private profile fields, only when it runs on this computer
  llm_fill:                  # docs/architecture/llm_fill_design.md §13.4
    num_ctx: 32768
    page_timeout_s: 120      # one model call
    max_fields_per_call: 20
    long_list: 15            # longer option lists go through a pick call
    keep_alive: "15m"        # keep the model loaded between steps (sent only when set)
    second_opinion: true
    cache: true              # replay a job's earlier pages on a retry, no model calls
    max_followups: 25
    max_reveal_rounds: 2     # re-reads after an answer revealed new fields
    debug_dump: false        # true: data/apply/<id>/prompts/NN.json (local, gitignored)
  compose:                   # Q-45 (llm_fill_design section 19): owner opt-in
    enabled: false           # true: the local model writes cover letters / "why join" answers
                             # from your master resume (fact-checked); false: they become questions
    letter_max_words: 250
    answer_max_words: 120
    file_format: docx        # docx | txt, for a cover-letter upload
  mail:
    host: imap.gmail.com
    port: 993
    wait_s: 300              # F-36
    poll_s: 10
  mail_backup:               # D-70: mailbox for contact.backup_email; host "" = same mailbox as `mail`
    host: ""
    port: 993

tailor:
  # The resume tailor (M20, docs/architecture/tailor_design.md). It never adds a
  # skill, tool, employer, title, date or number: it swaps a resume word for a
  # true synonym of the job's own word, and puts the most relevant bullets first.
  enabled: true
  llm: false                 # D-67: bullet + summary rewrite (M22 layer); stays false
  llm_terms: true            # D-68: LLM JD term extraction (M21); no effect in M20
  temperature: 0.25          # D-60; used only when llm is true (M22)
  top_k: 20
  seed: 7
  headline: true             # D-60: the job title as a headline under your name
  pdf: true                  # through Word, when installed
  page_ceiling: auto         # auto = your resume's page count, or a number
  max_jd_chars: 12000
  draft_days: 7              # D-59: a draft's files are deleted after this many days
  sent_days_after_close: 30  # D-59: a sent resume's files, after the application closes
  closed_statuses: [rejected, withdrawn]

question_capture:              # questions_design.md (D-74)
  enabled: true                # capture required questions no tier answered
  llm_naming: true             # let the local model name and group non-sensitive questions (never answer)
  naming_timeout_s: 20
  naming_max_per_attempt: 10

mail_status:                   # F-50: application status from email (docs/architecture/mail_status_design.md)
  enabled: true                # master switch; each mailbox has its own switch in Settings
  interval_min: 10             # 5-120
  startup_delay_s: 60
  catchup_delay_s: 60
  first_sync_max_days: 180
  max_headers_per_sync: 2000
  max_bodies_per_sync: 200
  max_body_bytes: 5000000      # larger: classified from the subject
  sync_timeout_s: 600
  model: true
  model_max_calls: 20
  model_max_chars: 6000
  model_timeout_s: 60
  retry_model_days: 3
  require_auth: true           # automatic changes need Gmail DKIM/DMARC pass
  ranks: {to_apply: 0, applied: 1, assessment: 2, interviewing: 3, offer: 4}
  terminal: [rejected, withdrawn]
  category_status: {acknowledged: applied, assessment: assessment, interview: interviewing,
                    offer: offer, rejected: rejected, withdrawn: withdrawn,
                    posting_closed: rejected, kept_on_file: rejected}
  suggest_only: [posting_closed, kept_on_file]
  junk_auto: [acknowledged]
