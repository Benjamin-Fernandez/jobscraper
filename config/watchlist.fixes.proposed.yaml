# PROPOSED watchlist fixes - NOT applied. Review, then paste each entry over the
# entry with the same `key` in config/watchlist.yaml (keys are unchanged, so
# scrape history and failure counts are kept; the new careers_url clears the
# old cached resolution).
#
# Every entry below was VERIFIED on 2026-09-24 by building a WatchedCompany and
# calling pipeline.fetch_one(pipeline.make_client(load_config()), company) with
# the project's own adapters: ok=True and postings > 0.
#
# "SG" = postings whose location or title contains "Singapore". Workday and
# Workable feeds stop at MAX_JOBS=600, so a "600" count is truncated.
# generic_html feeds carry no location. Those URLs are Singapore-filtered search
# pages, and the counts are the job links on the first results page.
#
# Two need a decision before pasting (see watchlist_fixes.report.md):
#   uob  - Singapore roles are labelled "Central Region (City Area)", which the
#          location_explicit rule rejects unless you add an allow token.
#   ncs-group, credit-agricole-cib, nomura - generic_html also picks up a few
#          navigation links alongside the real postings.
